<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img"><title>Transparenz mit integrierter Sonnenkontrolle</title><rect width="900" height="650" fill="#fafbf6"/><text x="35" y="45" font-family="Arial,sans-serif" font-size="27" fill="#171b19" font-weight="bold">Transparenz mit integrierter Sonnenkontrolle</text><rect x="55" y="100" width="790" height="100" rx="3" fill="#dce9ec" stroke="none"/><text x="80" y="140" font-family="Arial,sans-serif" font-size="25" fill="#171b19" font-weight="bold">Glas / Isolierverglasung</text><text x="80" y="174" font-family="Arial,sans-serif" font-size="20" fill="#171b19" font-weight="normal">Transparenz, Tageslicht und Wetterabschluss</text><rect x="55" y="225" width="790" height="100" rx="3" fill="#d9ef65" stroke="none"/><text x="80" y="265" font-family="Arial,sans-serif" font-size="25" fill="#171b19" font-weight="bold">Aluminium-Streckmetall im Glas</text><text x="80" y="299" font-family="Arial,sans-serif" font-size="20" fill="#171b19" font-weight="normal">Sonnenexponierte Bereiche: direkte Einstrahlung reduzieren</text><rect x="55" y="350" width="790" height="100" rx="3" fill="#e6e8de" stroke="none"/><text x="80" y="390" font-family="Arial,sans-serif" font-size="25" fill="#171b19" font-weight="bold">Low-E-Beschichtung / Kryptonfüllung</text><text x="80" y="424" font-family="Arial,sans-serif" font-size="20" fill="#171b19" font-weight="normal">Laut LMN bei etwa der Hälfte der Isolierglaselemente</text><text x="55" y="511" font-family="Arial,sans-serif" font-size="22" fill="#171b19" font-weight="normal">Funktionsübersicht: kein Schichtenquerschnitt.</text><text x="55" y="548" font-family="Arial,sans-serif" font-size="20" fill="#171b19" font-weight="normal">Scheibenzahl und Aufbau unterscheiden sich je Fassadentyp.</text><text x="35" y="603" font-family="Arial,sans-serif" font-size="16" fill="#171b19" font-weight="normal">Eigene Analyse · Johannes Fink · ohne Maßstab</text><text x="35" y="628" font-family="Arial,sans-serif" font-size="16" fill="#171b19" font-weight="normal">[LMN 5; Front 7] · Funktionsschema</text></svg>